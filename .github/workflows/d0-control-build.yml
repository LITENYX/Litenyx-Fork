name: D0 Control Build

on:
  workflow_dispatch:
  push:
    branches: [gate-t-testnet-activation]
    paths:
      - 'deploy/Makefile'
      - '.github/workflows/d0-control-build.yml'

concurrency:
  group: d0-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d0-control-build:
    name: D0 Control Build (pristine Dogecoin v1.14.9)
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      CXX: g++-10
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build deps (Dogecoin)
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          install_deps() {
            for i in 1 2 3 4 5; do
              if [ "$i" -ge 3 ]; then
                echo "Switching to fallback mirror us.archive.ubuntu.com (attempt $i)"
                sed -i 's|archive\.ubuntu\.com|us.archive.ubuntu.com|g' /etc/apt/sources.list
              fi
              apt-get update
              if apt-get install -y --fix-missing \
                git \
                build-essential libtool autotools-dev automake pkg-config \
                bsdmainutils python3 python3-pip libssl-dev libevent-dev \
                libboost-all-dev \
                libboost-test-dev libboost-thread-dev libboost-chrono-dev \
                libminiupnpc-dev libzmq3-dev libsqlite3-dev libdb++-dev libfmt-dev \
                g++-10; then
                return 0
              fi
              echo "apt-get attempt $i failed, retrying in 60s..."
              sleep 60
            done
            echo "ERROR: All apt-get attempts failed."
            return 1
          }
          install_deps
          python3 -m pip install --upgrade pip pytest

      - name: Clone Dogecoin base (pinned)
        working-directory: deploy
        run: make clone-dogecoin

      - name: Verify pin
        working-directory: deploy
        run: |
          make d0-control-build > build_d0_diag.log 2>&1; rc=$?
          cat build_d0_diag.log
          exit $rc

      - name: Verify binary identity
        working-directory: deploy
        run: |
          test -x external/dogecoin/src/dogecoind || { echo "FATAL: dogecoind missing"; exit 1; }
          test -x external/dogecoin/src/dogecoin-cli || { echo "FATAL: dogecoin-cli missing"; exit 1; }
          test -x external/dogecoin/src/dogecoin-tx || { echo "FATAL: dogecoin-tx missing"; exit 1; }
          sha256sum external/dogecoin/src/dogecoind > d0_binary_hash.txt
          sha256sum external/dogecoin/src/dogecoin-cli >> d0_binary_hash.txt
          sha256sum external/dogecoin/src/dogecoin-tx >> d0_binary_hash.txt
          cat d0_binary_hash.txt

      - name: Upload D0 binary hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D0-binary-hashes
          path: deploy/d0_binary_hash.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D0-build-diag
          path: deploy/build_d0_diag.log